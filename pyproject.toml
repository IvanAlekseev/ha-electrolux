[project]
name = "ha-electrolux"
version = "0.0.0"
requires-python = ">=3.14.2,<3.15"

[dependency-groups]
# Prefer the newest compatible releases within the supported compatibility ranges.
test = [
    "homeassistant>=2026.7.4,<2027.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "pyjwt>=2.12.1,<3.0.0",
    "electrolux-group-developer-sdk",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
]
dev = [
    "aiohttp>=3.14.3,<4.0.0",
    "deep_translator",
    "pydantic>=2.13.4,<3.0.0",
    "electrolux-group-developer-sdk",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
# NOTE: target-version is pinned to "py313" (not "py314") as a workaround for a
# Ruff formatter bug (ruff 0.16.x) that rewrites `except (A, B):` into the
# invalid Python 2 form `except A, B:` when targeting py314, producing a
# SyntaxError on Python 3.14. See https://github.com/astral-sh/ruff/issues/25923
# Revert to "py314" once a Ruff release fixes this. py313-targeted code is
# valid on Python 3.14, so this is safe.
target-version = "py313"
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
ignore = [
    "BLE001",
    "G201",
    "S110",
    "SIM102",
    "SIM103",
    "TRY203",
    "TRY401",
]
